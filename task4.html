<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Table and Form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="header">
        <h1>My Website</h1>
    </div>

    <div class="navbar">
        <a href="index.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="exercise1/index.html">Task 3</a>
        <a href="task4.html">Task 4</a>
    </div>

    <div class="grades-feedback-container">
        <div class="table-wrapper">
            <h2 id="grades-title">Student Grades</h2>
            <table>
                <tr>
                    <th>Name</th>
                    <th>Subject</th>
                    <th>Grade</th>
                </tr>
                <tr>
                    <td rowspan="2">Sanzhar</td>
                    <td>Web FrontEnd</td>
                    <td>95</td>
                </tr>
                <tr>
                    <td>Operating Systems</td>
                    <td>88</td>
                </tr>
                <tr class="highlight-row">
                    <td>Erzhan</td>
                    <td>Web FrontEnd</td>
                    <td>100</td>
                </tr>
                <tr>
                    <td>Bekarys</td>
                    <td>Data Analysis and Algorithms</td>
                    <td>76</td>
                </tr>
            </table>
        </div>
        <form class="feedback-form">
            <h2>Feedback Form</h2>
    
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
    
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
    
            <label for="role">Role</label>
            <select id="role" name="role">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="other">Other</option>
            </select>
    
            <label>Was this course helpful?</label>
            <input type="radio" id="yes" name="helpful" value="yes">
            <label for="yes" style="display:inline; font-weight:normal;">Yes</label>
            <input type="radio" id="no" name="helpful" value="no">
            <label for="no" style="display:inline; font-weight:normal;">No</label>
    
            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" rows="4"></textarea>
    
            <button type="submit" id="submit-btn">Submit</button>
        </form>
    </div>

    <div class="footer">
        <p>&copy; 2026 Sun</p>
    </div>

</body>
</html>
